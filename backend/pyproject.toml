[project]
name = "backend"
version = "0.1.0"
description = "Liveness and replay-risk scoring API for merchant KYC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.4.6",
    "onnxruntime>=1.29.0",
    "opencv-python-headless>=4.8,<5",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.4",
]

[tool.setuptools.packages.find]
include = ["app*", "models*"]